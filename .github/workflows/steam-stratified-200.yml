name: Collect full Steam review frames and 200 stratified candidates
on:
  push:
    paths:
      - '.github/workflows/steam-stratified-200.yml'
  workflow_dispatch:
concurrency:
  group: steam-200-review-collector
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and encryption dependencies
        run: python -m pip install pandas requests cryptography
      - name: Check collection script syntax
        run: python -m py_compile scripts/collect_stratified_200.py
      - name: Download all five period frames and sample with seed 410
        run: python scripts/collect_stratified_200.py
      - name: Preserve only encrypted archives as short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-steam-stratified-dataset
          path: |
            data_encrypted/steam_complete_frame_encrypted.json
            data_encrypted/steam_stratified_sample_encrypted.json
          retention-days: 14
          if-no-files-found: error
      - name: Commit deidentified results and encrypted archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stratified_collection_manifest.json data/stratified_collection_summary.md data/stratified_sample_features.csv
          git add data_encrypted/steam_complete_frame_encrypted.json data_encrypted/steam_stratified_sample_encrypted.json
          git commit -m "Publish verified complete period frames and 200 stratified sample candidates"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Verified stratified sampling files safely published."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Safe push failed, no force-push attempted" >&2
          exit 1
