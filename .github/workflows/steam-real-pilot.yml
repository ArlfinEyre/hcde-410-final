name: Fetch genuine Steam review pilot
on:
  push:
    paths:
      - '.github/workflows/steam-real-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  steam-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install review collector dependencies
        run: python -m pip install pandas requests
      - name: Fetch original reviews and derive anonymized data
        run: python scripts/collect_real_pilot.py
      - name: Commit metadata derived from genuine API responses
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/real_steam_pilot_features.csv data/real_steam_pilot_status.json data/real_steam_pilot_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Steam API pilot derived data"
            git push
          fi
