name: Fetch genuine Steam review pilot
on:
  push:
    paths:
      - '.github/workflows/steam-real-pilot.yml'
  workflow_dispatch:

# Only one publisher updates the output files at a time.
concurrency:
  group: steam-review-pilot-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  steam-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install review collector dependencies
        run: python -m pip install pandas requests cryptography
      - name: Fetch original reviews and derive nonidentifying data
        run: python scripts/collect_real_pilot.py
      - name: Encrypt and preserve original review text
        run: python scripts/encrypt_private_pilot.py
      - name: Commit and safely publish derived pilot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/real_steam_pilot_features.csv data/real_steam_pilot_status.json data/real_steam_pilot_summary.md data_encrypted/steam_pilot_original_encrypted.json
          if git diff --cached --quiet; then
            echo "Generated data unchanged; no new commit."
            exit 0
          fi
          git commit -m "Publish verified Steam API pilot derived data"
          # Other project edits may arrive while API collection is running.
          # Rebase our data-only commit on the remote HEAD; never force-push.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Successfully published derived Steam pilot data."
              exit 0
            fi
            echo "Remote branch advanced during push (attempt $attempt); retrying safely."
            sleep $((attempt * 2))
          done
          echo "Unable to publish after safe retries; no force-push performed." >&2
          exit 1
